[project]
name = "discrete-diffusion-lab"
version = "0.1.0"
description = "Experiments with discrete diffusion models for binary mazes"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anywidget>=0.9",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbformat>=5.10",
    "numba>=0.60",
    "numpy>=2.0",
    "plotly>=5.24",
    "torch>=2.5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

